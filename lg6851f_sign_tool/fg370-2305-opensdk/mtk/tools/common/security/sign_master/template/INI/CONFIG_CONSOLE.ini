[ENGINE]
version='1'
engine_type='ADAPTER'
engine_name='python sign_master_flow.py'

[SIGN]
command='rsautl -sign'
cmd_input='-in'
cmd_key_file='-inkey'
cmd_key_label='-inlabel'
cmd_signature='-out'
cmd_digest_sha256='-pkeyopt digest:sha256'
cmd_digest_sha384='-pkeyopt digest:sha384'
cmd_digest_sha512='-pkeyopt digest:sha512'
cmd_padding_nopadding='-raw'
cmd_padding_pss='-pkeyopt rsa_padding_mode:pss'
cmd_pss_salt32='-pkeyopt rsa_pss_saltlen:32'
cmd_pss_salt48='-pkeyopt rsa_pss_saltlen:48'
cmd_pss_salt64='-pkeyopt rsa_pss_saltlen:64'

[GET_PUBLIC_KEY]
command='-export'
cmd_key_file='-inkey'
cmd_key_label='-inlabel'
cmd_pubk_file='-outfile'
